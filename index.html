<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikupai</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
background:linear-gradient(135deg,#87CEEB,#A5D8FF,#E3F6FF);
}

.container{
width:100%;
max-width:750px;
background:white;
padding:60px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 45px rgba(0,0,0,.15);
}

.brand{
font-size:65px;
font-weight:900;
color:#1877F2;
letter-spacing:3px;
margin-bottom:5px;
}

.shop{
font-size:22px;
letter-spacing:6px;
color:#666;
margin-bottom:40px;
}

h1{
font-size:46px;
color:#222;
margin-bottom:25px;
}

p{
font-size:21px;
line-height:1.8;
color:#555;
margin-bottom:40px;
}

.btn{
display:inline-block;
padding:18px 45px;
background:#1877F2;
color:#fff;
text-decoration:none;
font-size:20px;
font-weight:bold;
border-radius:10px;
transition:.3s;
}

.btn:hover{
background:#0d65d9;
transform:translateY(-3px);
}

.footer{
margin-top:40px;
font-size:15px;
color:#777;
}

@media(max-width:768px){

.container{
padding:35px 25px;
}

.brand{
font-size:45px;
}

.shop{
font-size:18px;
letter-spacing:4px;
}

h1{
font-size:34px;
}

p{
font-size:18px;
}

.btn{
width:100%;
font-size:18px;
padding:16px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="brand">PIKUPAI</div>

<div class="shop">BABY SHOP</div>

<h1>We're Working on It</h1>

<p>
We're currently improving our website to provide you with a better shopping experience.
<br><br>
For orders and inquiries, please visit our Facebook page.
</p>

<a class="btn" href="https://facebook.com/pikupaibabyshop" target="_blank">
Order on Facebook
</a>

<div class="footer">
Thank you for your patience.
</div>

</div>

</body>
</html>
